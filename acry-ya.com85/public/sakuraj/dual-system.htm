                      <td rowspan="2" valign="top"><p>　弊社は、平成24年1月30日に東京都教育委員会より都立六郷工科高等学校デュアルシステムの推進に貢献したことがに認められ、感謝状を頂きました。<br>
                        東京版デュアルシステムとは、産業会と学校とのパートナーシップにより、共同で人材育成を行う、新しい教育システムです。高校生が在学中に長期の就業訓練を通して、企業や業界が必要とする実践的な技能・技術を身に付け、企業と生徒双方の合意があれば、卒業後にその企業へ就職することを可能としています。<br>
