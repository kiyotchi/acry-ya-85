      var timeoutId;
      var sm_sc_m = 0.5;
      var sm_sc = 1;
      var sm_k = 0;
      var ii = 0
      var start_x = 0;
      var start_y = 0;
      var start_x2 = 0;
      var start_y2 = 0;
      var end_x = 0;
      var end_y = 0;
      var end_x2 = 0;
      var end_y2 = 0;
      var z_sc = 0;
      var move_f = 0;
      canvas = document.getElementById('zu');
      var fff = document.getElementById('form_semiorder');
      var context = canvas.getContext('2d');
     

function MM_popupMsg(msg) { //v1.0
alert(msg);
}
    var b_cnt=0;
    var s_cnt=0
	var llx1=0;
	var llx2=0;
	var lly1=0;
	var lly2=0;

      window.onload = function() {
      	
      	if(window.innerWidth<769){
      		let vh = window.innerHeight * 0.01;
      		document.documentElement.style.setProperty('--vh', '${vh}px');
      	}
        canvas.onclick = function(e) {
          // クリック位置の座標計算（canvasの左上を基準。-2ずつしているのはborderの分）
          var rect = e.target.getBoundingClientRect();
          mouseX = e.clientX - Math.floor(rect.left) - 2;
          mouseY = e.clientY - Math.floor(rect.top) - 2;
          z_x = mouseX;
          z_y = mouseY;
         // draw3(canvas, bai, 0);
        }
        const elem2 = document.querySelector('#zu');
        fff.ontouchstart = function(event) {
          var touches = event.changedTouches;
          if (event.touches.length > 1) {
            event.preventDefault();
          }
        }
        fff.ontouchmove = function(event) {
          event.preventDefault();
        }
        
        
        
        canvas.ontouchmove = function(event) {
          var touches = event.changedTouches;
          if (event.targetTouches.length > 1) {
            fff.ontouchmove = function(e) {
              e.preventDefault();
            }
            event.preventDefault();
            var x1 = touches[0].pageX;
            var y1 = touches[0].pageY;
            var x2 = touches[1].pageX;
            var y2 = touches[1].pageY;
            var distance = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
           
			
            clearTimeout(timeoutId);
            if (beseDistance) {
              var scale = distance / beseDistance;          
              sm_k = 1;
              if (scale < 1) {
              
                sm_sc = sm_sc - scale * 0.01;
                s_cnt=s_cnt+1
                if(s_cnt>=3){
                	s_cnt=0
                	draw6(0)
                }
              }
              if (scale > 1) {             
                sm_sc = sm_sc + scale * 0.01;
                b_cnt=b_cnt+1
                if(b_cnt>=3){
                
                	b_cnt=0
                	draw6(1)
                }
              }
              timeoutId = setTimeout(function() {
                beseDistance = 0;
                fff.ontouchmove = function(event) {
                  event.preventDefault();
                  s_cnt=3
                  b_cnt=3
                }
              }, 100);
            } else {
			
              	beseDistance = distance;
            }
          }
          if (event.targetTouches.length == 1) {
            fff.ontouchmove = function(e) {
              if (touches.length > 1) {
                e.preventDefault()
                return false
              }
            }
            sm_k = 1
            move_f = 1
          }
        }
        canvas.ontouchend = function(event) {
          var touches = event.changedTouches;
          fff.ontouchmove = function(event) {
            event.preventDefault()
          }
        }
        draw6(2);
      };
      
    </script>
